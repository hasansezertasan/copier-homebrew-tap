---
name: Template
# Renders the Copier template and runs the generated tap's own gate, so a
# template change that breaks a fresh tap fails here. Deny-by-default; the
# job opts back into exactly what it needs.
permissions: {}
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  render:
    name: Rendered tap passes its checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Render the template
        run: |
          pipx run --spec copier==9.18.2 copier copy --defaults --vcs-ref=HEAD \
            -d tap_name=demo -d tap_owner=example -d copyright_holder=Example \
            . "$RUNNER_TEMP/homebrew-demo"
      # Mirror a real clone: the README has users `git init` and add `origin`.
      - name: Initialise the rendered tap
        working-directory: ${{ runner.temp }}/homebrew-demo
        run: |
          git init -q -b main
          git remote add origin https://github.com/example/homebrew-demo
          git add -A
      # cobo (installed by mise through pipx) needs Python >= 3.14, newer than
      # the runner's system Python, so install one here and point pipx at it
      # below: pipx ignores PATH and uses its own default interpreter.
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.15"
      - name: Install mise
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785  # v5.2.8
        with:
          install: false
          cache: false
      - name: Run the rendered tap's checks
        working-directory: ${{ runner.temp }}/homebrew-demo
        run: |
          PIPX_DEFAULT_PYTHON="$(command -v python)"
          export PIPX_DEFAULT_PYTHON
          mise trust .config/mise.toml
          mise install
          mise run check
